spring:
  application:
    name: clear-ledger

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clearledger}
    username: ${DB_USER:clearledger}
    password: ${DB_PASSWORD:clearledger}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:clearledger-dev-secret-key-must-be-long-enough-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}